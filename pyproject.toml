[project]
name = "istanbul-walkshed"
version = "0.1.0"
description = "15-minute walking catchment map of Istanbul rail stations"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["istanbul", "openstreetmap", "osmnx", "isochrone", "walkshed", "transit", "15-minute-city"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "osmnx>=2.1,<3",
    "geopandas>=1.1",
    "networkx>=3.5",
    "shapely>=2.1",
    "folium>=0.20",
    "pyogrio>=0.13",
    "requests>=2.32",
    "scipy>=1.14",
]

[project.urls]
Repository = "https://github.com/Interdimensionel-Net/Istanbul-Accessibility-Map-15minwalk"
Issues = "https://github.com/Interdimensionel-Net/Istanbul-Accessibility-Map-15minwalk/issues"

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
walkshed = "walkshed.cli:main"
walkshed-web = "walkshed_web.cli:main"

[dependency-groups]
dev = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pillow>=12.3.0",
    "pydantic-settings>=2.6",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walkshed", "src/walkshed_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=walkshed_web --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
